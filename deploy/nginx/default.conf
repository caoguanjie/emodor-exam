# nginx 接入层（02 册 5.1 拓扑 / 07 册 4.1 传输安全 / NFR-16）
# 静态资源托管 + /api/v1 反向代理 + 上传体积限制；生产环境 TLS 终结见注释。
server {
    listen 80;
    server_name _;

    # 生产环境切换为 443 ssl 并 308 跳转（证书由企业内部 CA 签发或自签 + 内部分发信任）：
    # return 308 https://$host$request_uri;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 513m;   # 视频 512MiB + multipart 余量 1MiB；制度旧上传仍由应用层 50MiB 校验

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # CSP（07 册 4.4.2；内嵌图片以 data: URI 放行，与 4.3.2 净化白名单对齐）
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; img-src 'self' data: blob:; object-src 'none'; frame-ancestors 'self'; worker-src 'self' blob:" always;

    # /health 仅限 Compose 内部网络探活（04 册 §2：nginx 不对外代理该路径）
    location = /api/v1/health {
        return 404;
    }

    location /api/v1/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 覆盖式重写（非追加）：客户端伪造的 X-Forwarded-For 不被采信，配合应用层 trust proxy=1 还原真实来源
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 150s;   # AI 出题 120 秒长调用（NFR-05）+ 余量
        proxy_send_timeout 60s;
    }

    # 前端静态资源（内容哈希文件名长效缓存）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
